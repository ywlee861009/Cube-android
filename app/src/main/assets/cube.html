<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cube</title>
  <link rel="stylesheet" href="css/cube.css">
</head>
<body>
<div id="solved-overlay" class="hidden">
  <div id="solved-card">
    <div id="solved-emoji">🎉</div>
    <div id="solved-title">Solved!</div>
    <div id="solved-stats">
      <div class="s-stat">
        <span class="s-val" id="s-time">—</span>
        <span class="s-lbl">Time</span>
      </div>
      <div class="s-stat">
        <span class="s-val" id="s-moves">—</span>
        <span class="s-lbl">Moves</span>
      </div>
    </div>
    <div id="solved-new-best" class="hidden">New Best!</div>
    <div id="solved-pb" class="hidden">
      <div class="pb-divider"></div>
      <div id="solved-pb-stats">
        <div class="s-stat">
          <span class="s-val" id="s-pb-time">—</span>
          <span class="s-lbl pb-lbl">Best Time</span>
        </div>
        <div class="s-stat">
          <span class="s-val" id="s-pb-moves">—</span>
          <span class="s-lbl pb-lbl">Best Moves</span>
        </div>
      </div>
    </div>
    <button id="btn-play-again" onclick="playAgain()">⇄ Play Again</button>
  </div>
</div>

<div id="stats-overlay" class="hidden">
  <div id="stats-card">
    <div id="stats-header">
      <span id="stats-title">Statistics</span>
      <button id="btn-stats-close" onclick="closeDashboard()" aria-label="Close statistics">✕</button>
    </div>
    <div id="stats-grid">
      <div class="st-cell">
        <span class="st-val" id="ds-solves">—</span>
        <span class="st-lbl">Solves</span>
      </div>
      <div class="st-cell">
        <span class="st-val" id="ds-best">—</span>
        <span class="st-lbl">Best</span>
      </div>
      <div class="st-cell">
        <span class="st-val" id="ds-ao5">—</span>
        <span class="st-lbl">ao5</span>
      </div>
      <div class="st-cell">
        <span class="st-val" id="ds-ao12">—</span>
        <span class="st-lbl">ao12</span>
      </div>
      <div class="st-cell">
        <span class="st-val" id="ds-ao100">—</span>
        <span class="st-lbl">ao100</span>
      </div>
      <div class="st-cell">
        <span class="st-val" id="ds-mean">—</span>
        <span class="st-lbl">Mean</span>
      </div>
    </div>
    <div id="ds-sparkline-wrap">
      <div id="ds-sparkline"></div>
    </div>
    <div id="ds-history-list"></div>
  </div>
</div>

<div id="scan-overlay" class="hidden" aria-live="polite">
  <div id="scan-header">
    <div id="scan-progress">1 / 6 — 흰색 면 (U)</div>
    <div id="scan-direction">파랑 면(B)이 위로 오게 들어주세요</div>
    <div id="scan-orientation" aria-hidden="true">
      <span id="scan-top-face">B ↑</span>
      <div id="scan-mini-face">U</div>
    </div>
  </div>
  <div id="scan-guide">
    <div class="scan-grid-line scan-grid-v scan-grid-v1"></div>
    <div class="scan-grid-line scan-grid-v scan-grid-v2"></div>
    <div class="scan-grid-line scan-grid-h scan-grid-h1"></div>
    <div class="scan-grid-line scan-grid-h scan-grid-h2"></div>
    <div id="scan-rgb-preview"></div>
  </div>
  <div id="scan-controls">
    <div id="scan-message">카메라를 준비하고 있어요…</div>
    <div class="scan-control-row">
      <button id="btn-scan-previous" onclick="retakePreviousScanFace()" disabled>↶ 이전 면</button>
      <button id="btn-scan-capture" onclick="captureCurrentScanFace()" disabled>● 촬영</button>
    </div>
    <button id="btn-scan-cancel" onclick="cancelScanFlow()">취소</button>
  </div>
</div>

<div id="scan-review-overlay" class="hidden">
  <div id="scan-review-card">
    <div id="scan-review-header">
      <div>
        <div id="scan-review-title">스캔 결과 확인</div>
        <div id="scan-review-badge">확인이 필요한 칸 0개</div>
      </div>
      <button id="btn-scan-review-close" onclick="cancelScanReview()" aria-label="스캔 결과 닫기">✕</button>
    </div>
    <div id="scan-net" aria-label="큐브 6면 전개도"></div>
    <div id="scan-face-editor-title">흰색 면 (U)</div>
    <div id="scan-face-editor"></div>
    <div id="scan-palette" aria-label="색 선택 팔레트"></div>
    <div id="scan-validation-message"></div>
    <div id="scan-review-actions">
      <button id="btn-scan-again" onclick="restartScanFromReview()">다시 스캔</button>
      <button id="btn-scan-apply" onclick="confirmScanReview()" disabled>Solve 시작</button>
    </div>
  </div>
</div>

<div id="top-bar">
  <div id="timer">0.0s</div>
  <div id="moves">Moves: 0</div>
</div>
<button id="btn-theme" aria-label="Toggle dark mode">🌙</button>
<button id="btn-stats" onclick="openDashboard()" aria-label="Open statistics">📊</button>
<div id="ui">
  <div class="ui-row">
    <button id="btn-undo" onclick="undoCube()" disabled>↩ Undo</button>
    <button id="btn-redo" onclick="redoCube()" disabled>Redo ↪</button>
  </div>
  <div class="ui-row">
    <button id="btn-shuffle" onclick="shuffleCube()">⇄ Shuffle</button>
    <button id="btn-solve"   onclick="solveCube()">📺 Solve</button>
  </div>
  <div class="ui-row">
    <button id="btn-scan" onclick="startScanFlow()">📷 Scan Cube</button>
  </div>
</div>

<!-- Libraries -->
<script src="js/lib/confetti.min.js"></script>
<script src="js/three.min.js"></script>

<!-- Core cube -->
<script src="js/constants.js"></script>
<script src="js/scene.js"></script>
<script src="js/cubies.js"></script>
<script src="js/logic.js"></script>

<!-- Solver -->
<script src="js/lib/cubing-solver.bundle.js"></script>
<script src="js/solver/solver-base.js"></script>
<script src="js/solver/solver-cubing.js"></script>
<script src="js/solver/solver-factory.js"></script>

<!-- Game state & actions -->
<script src="js/actions.js"></script>
<script src="js/overlay.js"></script>
<script src="js/stats.js"></script>
<script src="js/scoring.js"></script>
<script src="js/history.js"></script>
<script src="js/scan/cube-validate.js"></script>
<script src="js/scan/color-classify.js"></script>
<script src="js/solve.js"></script>
<script src="js/shuffle.js"></script>

<!-- Animation & interaction -->
<script src="js/animation.js"></script>
<script src="js/layer-rotation.js"></script>
<script src="js/layer-snap.js"></script>
<script src="js/touch.js"></script>

<!-- Bridge -->
<script src="js/bridge.js"></script>
<script src="js/scan/scan-capture.js"></script>
<script src="js/scan/scan-ui.js"></script>
<script src="js/scan/scan-review.js"></script>

<!-- UI extras -->
<script src="js/theme.js"></script>
<script src="js/long-press.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
